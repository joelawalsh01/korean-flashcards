<html lang="en">
<head>
<meta charset="UTF-8">

<title>Korean Flashcards - Conversations 1–3 + TTMIK 7, 9, 10</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 20px;
  }

  /* --- Category Filters --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
    max-width: 600px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 2px solid #4361ee;
    border-radius: 20px;
    background: #fff;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .filter-btn:hover { background: #eef1ff; }

  .filter-btn.active {
    background: #4361ee;
    color: #fff;
  }

  /* --- Controls --- */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }

  .ctrl-btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: #4361ee;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .ctrl-btn:hover { background: #3a56d4; }

  .progress {
    font-size: 0.95rem;
    color: #555;
    font-weight: 500;
    min-width: 110px;
    text-align: center;
  }

  /* --- Card Scene --- */
  .card-scene {
    width: 340px;
    max-width: 90vw;
    height: 260px;
    perspective: 800px;
    margin-bottom: 20px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s ease;
    transform-style: preserve-3d;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .card-front {
    background: #fff;
  }

  .card-back {
    background: #4361ee;
    color: #fff;
    transform: rotateY(180deg);
  }

  .card-category {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.55;
  }

  .card-front .card-main {
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
  }

  .card-back .card-main {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }

  .card-back .pronunciation {
    margin-top: 8px;
    font-size: 1rem;
    opacity: 0.8;
  }

  .card-back .card-main {
    cursor: help;
    border-bottom: 1px dashed rgba(255,255,255,0.4);
    padding-bottom: 2px;
  }

  .romanization {
    display: none;
    margin-top: 6px;
    font-size: 0.85rem;
    opacity: 0.7;
    font-weight: 400;
  }

  .romanization.visible {
    display: block;
  }

  .card-hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.75rem;
    opacity: 0.4;
  }

  /* --- Nav Arrows --- */
  .nav {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .nav-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #e0e0e0;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .nav-btn:hover { background: #ccc; }

  .keyboard-hint {
    margin-top: 24px;
    font-size: 0.78rem;
    color: #999;
    text-align: center;
    line-height: 1.6;
  }

  .keyboard-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f9f9f9;
    font-family: inherit;
    font-size: 0.78rem;
  }

  /* --- Deck Switcher (shared across index/numbers/verbs) --- */
  .deck-switch {
    display: inline-flex;
    background: #e6e9f2;
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 20px;
  }

  .deck-btn {
    padding: 6px 16px;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }

  .deck-btn.active {
    background: #4361ee;
    color: #fff;
  }

  { english: "younger brother", korean: "남동생", romanization: "namdongsaeng", pronunciation: null, category: "Noun" },
  { english: "woman, female", korean: "여자", romanization: "yeoja", pronunciation: null, category: "Noun" },
  { english: "man, male", korean: "남자", romanization: "namja", pronunciation: null, category: "Noun" },
  { english: "sibling(s)", korean: "형제", romanization: "hyeongje", pronunciation: null, category: "Noun" },

  // Nouns
  { english: "time", korean: "시간", romanization: "sigan", pronunciation: null, category: "Noun" },
  { english: "fun (재미있다 = interesting)", korean: "재미", romanization: "jaemi", pronunciation: null, category: "Noun" },
  { english: "taste", korean: "맛", romanization: "mat", pronunciation: null, category: "Noun" },
  { english: "next door, neighbor's house", korean: "옆집", romanization: "yeopjip", pronunciation: null, category: "Noun" },
  { english: "umbrella", korean: "우산", romanization: "usan", pronunciation: null, category: "Noun" },
  { english: "food", korean: "음식", romanization: "eumsik", pronunciation: null, category: "Noun" },
  { english: "teacher; respectful term", korean: "선생님", romanization: "seonsaengnim", pronunciation: null, category: "Noun" },
  { english: "customer, guest", korean: "손님", romanization: "sonnim", pronunciation: null, category: "Noun" },
  { english: "driver (respectful)", korean: "기사님", romanization: "gisanim", pronunciation: null, category: "Noun" },

  // Suffix
  { english: "Mr./Ms. (after a name)", korean: "씨", romanization: "ssi", pronunciation: null, category: "Suffix" },
];

const categories = [...new Set(allCards.map(c => c.category))];

let activeCategory = "All";
let deck = [...allCards];
let idx = 0;

// --- Filters ---
const filtersEl = document.getElementById("filters");

function buildFilters() {
  filtersEl.innerHTML = "";
  ["All", ...categories].forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      applyFilter();
    });
    filtersEl.appendChild(btn);
  });
}

function applyFilter() {
  deck = activeCategory === "All" ? [...allCards] : allCards.filter(c => c.category === activeCategory);
  idx = 0;
  buildFilters();
  render();
}

// --- Render ---
const cardEl = document.getElementById("card");
const frontCat = document.getElementById("frontCat");
const frontMain = document.getElementById("frontMain");
const backCat = document.getElementById("backCat");
const backMain = document.getElementById("backMain");
const backPron = document.getElementById("backPron");
const backRoman = document.getElementById("backRoman");
const backHint = document.getElementById("backHint");
const progressEl = document.getElementById("progress");

function render() {
  cardEl.classList.remove("flipped");
  backRoman.classList.remove("visible");
  if (deck.length === 0) {
    frontCat.textContent = "";
    frontMain.textContent = "No cards";
    backCat.textContent = "";
    backMain.textContent = "";
    backRoman.textContent = "";
    backPron.textContent = "";
    progressEl.textContent = "0 of 0";
    backHint.textContent = "tap to flip";
    return;
  }
  const c = deck[idx];
  frontCat.textContent = c.category;
  frontMain.textContent = c.english;
  backCat.textContent = c.category;
  backMain.textContent = c.korean;
  backRoman.textContent = c.romanization || "";
  backPron.textContent = c.pronunciation || "";
  backHint.textContent = "hover hangul for romanization";
  progressEl.textContent = `Card ${idx + 1} of ${deck.length}`;
}

// --- Romanization hover/tap ---
backMain.addEventListener("mouseenter", () => backRoman.classList.add("visible"));
backMain.addEventListener("mouseleave", () => backRoman.classList.remove("visible"));
backMain.addEventListener("touchstart", (e) => {
  e.stopPropagation();
  backRoman.classList.toggle("visible");
}, { passive: true });

// --- Flip ---
document.getElementById("cardScene").addEventListener("click", () => {
  cardEl.classList.toggle("flipped");
});

// --- Navigation ---
function prev() {
  if (deck.length === 0) return;
  idx = (idx - 1 + deck.length) % deck.length;
  render();
}

function next() {
  if (deck.length === 0) return;
  idx = (idx + 1) % deck.length;
  render();
}

document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("nextBtn").addEventListener("click", next);

// --- Shuffle ---
document.getElementById("shuffleBtn").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  render();
});

// --- Keyboard ---
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === " ") { e.preventDefault(); cardEl.classList.toggle("flipped"); }
});

// --- Init ---
buildFilters();
render();
</script>
</body>
</html>
