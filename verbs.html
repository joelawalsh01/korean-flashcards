<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Flashcards - Verbs & Conjugation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 16px;
  }

  /* --- Mode Toggle --- */
  .mode-toggle {
    display: inline-flex;
    background: #e6e9f2;
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 16px;
  }

  .mode-btn {
    padding: 6px 18px;
    border: none;
    background: transparent;
    color: #4361ee;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }

  .mode-btn.active {
    background: #4361ee;
    color: #fff;
  }

  /* --- Filters --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
    max-width: 600px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 2px solid #4361ee;
    border-radius: 20px;
    background: #fff;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .filter-btn:hover { background: #eef1ff; }

  .filter-btn.active { background: #4361ee; color: #fff; }

  .tense-filters .filter-btn {
    border-color: #7048e8;
    color: #7048e8;
  }
  .tense-filters .filter-btn:hover { background: #f2ecff; }
  .tense-filters .filter-btn.active { background: #7048e8; color: #fff; }

  .tense-filters { display: none; }

  /* Mode + direction pills sit on one row, wrapping on narrow screens. */
  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .toggles .mode-toggle { margin-bottom: 0; }

  .dir-toggle .mode-btn { color: #7048e8; }
  .dir-toggle .mode-btn.active { background: #7048e8; color: #fff; }
  /* Conjugate mode always asks for Korean, so the direction pill is moot there. */
  body.mode-conjugate .dir-toggle { display: none; }
  body.mode-conjugate .tense-filters { display: flex; }

  .filters-label {
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  /* --- Controls --- */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
    margin-bottom: 16px;
  }

  .ctrl-btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: #4361ee;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .ctrl-btn:hover { background: #3a56d4; }

  .progress {
    font-size: 0.95rem;
    color: #555;
    font-weight: 500;
    min-width: 110px;
    text-align: center;
  }

  /* --- Card Scene --- */
  .card-scene {
    width: 360px;
    max-width: 92vw;
    height: 280px;
    perspective: 800px;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s ease;
    transform-style: preserve-3d;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .card-front { background: #fff; }

  .card-back {
    background: #4361ee;
    color: #fff;
    transform: rotateY(180deg);
  }

  .card.correct .card-back { background: #2f9e44; }
  .card.incorrect .card-back { background: #c92a2a; }

  .card-category {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.55;
  }

  .tense-chip {
    position: absolute;
    top: 14px;
    right: 18px;
    padding: 3px 10px;
    background: #7048e8;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 10px;
  }

  .card-front .card-main {
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
  }

  .card-front .card-main.hangul {
    font-size: 2rem;
    font-weight: 700;
  }

  .card-front .card-sub {
    margin-top: 6px;
    font-size: 0.95rem;
    color: #666;
  }

  .card-back .card-main {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }

  .card-back .pronunciation {
    margin-top: 6px;
    font-size: 0.95rem;
    opacity: 0.85;
  }

  /* Conjugation list on back face (Recall mode) */
  .conj-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.95rem;
    opacity: 0.95;
    width: 100%;
    max-width: 260px;
  }

  .conj-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .conj-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    font-weight: 600;
  }

  .conj-form { font-weight: 600; }

  .card-hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.75rem;
    opacity: 0.4;
  }

  /* --- Full-drill step list (front face) --- */
  body.mode-full .card-scene { height: 360px; }

  .step-list {
    display: none;
    flex-direction: column;
    gap: 3px;
    margin-top: 12px;
    width: 100%;
    max-width: 290px;
    font-size: 0.9rem;
  }
  body.mode-full .step-list { display: flex; }

  .step-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .step-row.current { background: #eef1ff; }

  .step-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.6;
    white-space: nowrap;
  }

  .step-ans { font-weight: 600; text-align: right; }
  .step-row.pending .step-ans { opacity: 0.3; }
  .step-row.ok  .step-ans { color: #2f9e44; }
  .step-row.bad .step-ans { color: #c92a2a; }

  .step-you {
    font-size: 0.75rem;
    font-weight: 400;
    opacity: 0.55;
    text-decoration: line-through;
    margin-right: 6px;
  }

  /* Per-row marks on the summary table (back face) */
  .conj-row.ok  .conj-label::before { content: "✓ "; color: #b2f2bb; }
  .conj-row.bad .conj-label::before { content: "✗ "; color: #ffc9c9; }

  /* --- Conjugate input --- */
  .answer-row {
    display: none;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    width: 360px;
    max-width: 92vw;
  }
  body.mode-conjugate .answer-row,
  body.mode-full .answer-row { display: flex; }

  .answer-input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 1.1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .answer-input:focus { border-color: #4361ee; }

  /* --- Nav --- */
  .nav {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .nav-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #e0e0e0;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .nav-btn:hover { background: #ccc; }

  .keyboard-hint {
    margin-top: 20px;
    font-size: 0.78rem;
    color: #999;
    text-align: center;
    line-height: 1.6;
  }

  .keyboard-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f9f9f9;
    font-family: inherit;
    font-size: 0.78rem;
  }


  /* --- Audio button (playback lives in speak.js) --- */
  .speak-btn {
    border: none;
    background: rgba(255,255,255,0.2);
    color: inherit;
    font-size: 0.95rem;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .speak-btn:hover { background: rgba(255,255,255,0.36); }
  .speak-btn:active { transform: scale(0.9); }

  .speak-btn.small { font-size: 0.7rem; padding: 3px 5px; }

  /* Keeps the hangul and its speaker button on one line. */
  .main-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  /* --- Deck Switcher (shared across index/numbers/verbs/particles) --- */
  .deck-switch {
    display: inline-flex;
    background: #e6e9f2;
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 20px;
  }

  .deck-btn {
    padding: 6px 16px;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }

  .deck-btn.active {
    background: #4361ee;
    color: #fff;
  }
</style>
</head>

<nav class="deck-switch">
  <a class="deck-btn" href="index.html">Vocabulary</a>

<h1>Korean Verbs &amp; Conjugation</h1>
<p class="subtitle">TTMIK Level 1 Lessons 17–18 &amp; Level 2 Lesson 1 — recall meanings and drill conjugations</p>

<div class="toggles">
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="recall">Recall</button>
    <button class="mode-btn" data-mode="conjugate">Conjugate</button>
    <button class="mode-btn" data-mode="full">Full drill</button>
  </div>
  <div class="mode-toggle dir-toggle">
    <button class="mode-btn active" data-dir="en-ko">English → 한국어</button>
    <button class="mode-btn" data-dir="ko-en">한국어 → English</button>
  </div>
</div>

<div class="filters" id="filters"></div>
<div class="filters tense-filters" id="tenseFilters"></div>

<div class="controls">
  <button class="ctrl-btn" id="shuffleBtn">Shuffle</button>
  <span class="progress" id="progress"></span>
</div>

<div class="card-scene" id="cardScene">
  <div class="card" id="card">
    <div class="card-face card-front">
      <span class="card-category" id="frontCat"></span>
      <span class="tense-chip" id="frontTense" style="display:none;"></span>
      <span class="card-main" id="frontMain"></span>
      <span class="card-sub" id="frontSub"></span>
      <div class="step-list" id="stepList"></div>
      <span class="card-hint" id="frontHint">tap to flip</span>
    </div>
    <div class="card-face card-back">
      <span class="card-category" id="backCat"></span>
      <div class="main-row"><span class="card-main" id="backMain"></span><span id="backSpeak"></span></div>
      <span class="pronunciation" id="backRoman"></span>
      <div class="conj-list" id="conjList"></div>
      <span class="card-hint" id="backHint">tap to flip</span>
    </div>
  </div>
</div>

<div class="answer-row">
  <input type="text" class="answer-input" id="answerInput" placeholder="Type conjugation (hangul or romanization)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="ctrl-btn" id="checkBtn">Check</button>
</div>

<div class="nav">
  <button class="nav-btn" id="prevBtn">&#8592;</button>
  <button class="nav-btn" id="nextBtn">&#8594;</button>
</div>

<p class="keyboard-hint">
  <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &nbsp;&middot;&nbsp; <kbd>Space</kbd> flip &nbsp;&middot;&nbsp; <kbd>Enter</kbd> check (Conjugate / Full drill) &nbsp;&middot;&nbsp; <kbd>S</kbd> hear it
</p>

<script>
// ===== Tense metadata =====
// Order here controls display order in filters and conjugation list.
const TENSES = [
  { key: "present", label: "Present",  short: "PRES", desc: "polite -요" },
  { key: "past",    label: "Past",     short: "PAST", desc: "-았/었어요" },
  { key: "future",  label: "Future",   short: "FUT",  desc: "-(으)ㄹ 거예요" },
  { key: "want",    label: "Want to",  short: "WANT", desc: "-고 싶어요" },
];

// Full-drill chain (Class 25 / TTMIK Level 2 Lesson 1): dictionary form first,
// then future, past, present — the order the lesson practises them in.
const CHAIN = ["base", "future", "past", "present"];

// ===== Verb data =====
// Each verb: english, korean (base -다 form), romanization, category, conjugations map.
// A tense entry may be null if the form doesn't naturally apply — those cards are
// skipped when that tense is the active filter in Conjugate mode.
const allVerbs = [
  // ===== Lesson 18 (TTMIK) — Core Action Verbs =====
  {
    english: "to go",
    korean: "가다", romanization: "ga-da", category: "Action Verb",
    conjugations: {
      present: { korean: "가요",         romanization: "ga-yo" },
      past:    { korean: "갔어요",       romanization: "ga-sseo-yo" },
      future:  { korean: "갈 거예요",     romanization: "gal geo-ye-yo" },
      want:    { korean: "가고 싶어요",  romanization: "ga-go si-peo-yo" },
    },
  },
  {
    english: "to come",
    korean: "오다", romanization: "o-da", category: "Action Verb",
    conjugations: {
      present: { korean: "와요",         romanization: "wa-yo" },
      past:    { korean: "왔어요",       romanization: "wa-sseo-yo" },
      future:  { korean: "올 거예요",     romanization: "ol geo-ye-yo" },
      want:    { korean: "오고 싶어요",  romanization: "o-go si-peo-yo" },
    },
  },
  {
    english: "to see, to watch",
    korean: "보다", romanization: "bo-da", category: "Action Verb",
    conjugations: {
      present: { korean: "봐요",         romanization: "bwa-yo" },
      past:    { korean: "봤어요",       romanization: "bwa-sseo-yo" },
      future:  { korean: "볼 거예요",     romanization: "bol geo-ye-yo" },
      want:    { korean: "보고 싶어요",  romanization: "bo-go si-peo-yo" },
    },
  },
  {
    english: "to do",
    korean: "하다", romanization: "ha-da", category: "하다 Verb",
    conjugations: {
      present: { korean: "해요",         romanization: "hae-yo" },
      past:    { korean: "했어요",       romanization: "hae-sseo-yo" },
      future:  { korean: "할 거예요",     romanization: "hal geo-ye-yo" },
      want:    { korean: "하고 싶어요",  romanization: "ha-go si-peo-yo" },
    },
  },
  {
    english: "to eat",
    korean: "먹다", romanization: "meok-da", category: "Action Verb",
    conjugations: {
      present: { korean: "먹어요",       romanization: "meo-geo-yo" },
      past:    { korean: "먹었어요",     romanization: "meo-geo-sseo-yo" },
      future:  { korean: "먹을 거예요",   romanization: "meo-geul geo-ye-yo" },
      want:    { korean: "먹고 싶어요",  romanization: "meok-go si-peo-yo" },
    },
  },
  {
    english: "to sit",
    korean: "앉다", romanization: "an-da", category: "Action Verb",
    conjugations: {
      present: { korean: "앉아요",       romanization: "an-ja-yo" },
      past:    { korean: "앉았어요",     romanization: "an-ja-sseo-yo" },
      future:  { korean: "앉을 거예요",   romanization: "an-jeul geo-ye-yo" },
      want:    { korean: "앉고 싶어요",  romanization: "an-go si-peo-yo" },
    },
  },
  {
    english: "to know",
    korean: "알다", romanization: "al-da", category: "Action Verb",
    conjugations: {
      present: { korean: "알아요",       romanization: "a-ra-yo" },
      past:    { korean: "알았어요",     romanization: "a-ra-sseo-yo" },
      future:  { korean: "알 거예요",    romanization: "al geo-ye-yo" },
      want:    { korean: "알고 싶어요",  romanization: "al-go si-peo-yo" },
    },
  },
  {
    english: "to like",
    korean: "좋아하다", romanization: "jo-a-ha-da", category: "하다 Verb",
    conjugations: {
      present: { korean: "좋아해요",       romanization: "jo-a-hae-yo" },
      past:    { korean: "좋아했어요",     romanization: "jo-a-hae-sseo-yo" },
      future:  { korean: "좋아할 거예요",   romanization: "jo-a-hal geo-ye-yo" },

      present: { korean: "공부해요",       romanization: "gong-bu-hae-yo" },
      past:    { korean: "공부했어요",     romanization: "gong-bu-hae-sseo-yo" },
      future:  { korean: "공부할 거예요",   romanization: "gong-bu-hal geo-ye-yo" },
      want:    { korean: "공부하고 싶어요", romanization: "gong-bu-ha-go si-peo-yo" },
    },
  },

  // ===== Existence / State =====
  {
    english: "to be, to exist",
    korean: "있다", romanization: "it-da", category: "Existence",
    conjugations: {
      present: { korean: "있어요",   romanization: "i-sseo-yo" },
      past:    { korean: "있었어요", romanization: "i-sseo-sseo-yo" },
      future:  { korean: "있을 거예요", romanization: "i-sseul geo-ye-yo" },
      want:    null,
    },
  },

  // ===== Tandem: 60 Korean Verbs — Everyday Actions =====
  {
    english: "to drink",
    korean: "마시다", romanization: "ma-si-da", category: "Everyday",
    conjugations: {
      present: { korean: "마셔요",         romanization: "ma-syeo-yo" },
      past:    { korean: "마셨어요",       romanization: "ma-syeo-sseo-yo" },
      future:  { korean: "마실 거예요",     romanization: "ma-sil geo-ye-yo" },
      want:    { korean: "마시고 싶어요",  romanization: "ma-si-go si-peo-yo" },
    },
  },
  {
    english: "to sleep",
    korean: "자다", romanization: "ja-da", category: "Everyday",
    conjugations: {
      present: { korean: "자요",           romanization: "ja-yo" },
      past:    { korean: "잤어요",         romanization: "ja-sseo-yo" },
      future:  { korean: "잘 거예요",       romanization: "jal geo-ye-yo" },
      want:    { korean: "자고 싶어요",    romanization: "ja-go si-peo-yo" },
    },
  },
  {
    english: "to wake up, to get up",
    korean: "일어나다", romanization: "i-reo-na-da", category: "Everyday",
    conjugations: {
      present: { korean: "일어나요",         romanization: "i-reo-na-yo" },
      past:    { korean: "일어났어요",       romanization: "i-reo-na-sseo-yo" },
      future:  { korean: "일어날 거예요",     romanization: "i-reo-nal geo-ye-yo" },
      want:    { korean: "일어나고 싶어요",  romanization: "i-reo-na-go si-peo-yo" },
    },

      present: { korean: "무거워요",   romanization: "mu-geo-wo-yo" },
      past:    { korean: "무거웠어요", romanization: "mu-geo-wo-sseo-yo" },
      future:  { korean: "무거울 거예요", romanization: "mu-geo-ul geo-ye-yo" },
      want:    null,
    },
  },
  {
    // ㅂ irregular: ㅂ → 우 before a vowel ending
    english: "to be cute",
    korean: "귀엽다", romanization: "gwi-yeop-da", category: "Descriptive",
    conjugations: {
      present: { korean: "귀여워요",   romanization: "gwi-yeo-wo-yo" },
      past:    { korean: "귀여웠어요", romanization: "gwi-yeo-wo-sseo-yo" },
      future:  { korean: "귀여울 거예요", romanization: "gwi-yeo-ul geo-ye-yo" },
      want:    null,
    },
  },
  {
    // 르 irregular: 빠르 + 아요 → 빨라요
    english: "to be fast",
    korean: "빠르다", romanization: "ppa-reu-da", category: "Descriptive",
    conjugations: {
      present: { korean: "빨라요",   romanization: "ppal-la-yo" },
      past:    { korean: "빨랐어요", romanization: "ppal-la-sseo-yo" },
      future:  { korean: "빠를 거예요", romanization: "ppa-reul geo-ye-yo" },
      want:    null,
    },
  },

  // ===== Class 25 (TTMIK Level 2, Lesson 1) — Future Tense =====
  // Future = stem + ㄹ 거예요 (vowel stem), 을 거예요 (consonant stem), or just
  // 거예요 when the stem already ends in ㄹ (놀다, 멀다, 살다).
  {
    english: "to stick to, to pass (an exam)",
    korean: "붙다", romanization: "but-da", category: "Everyday",
    conjugations: {
      present: { korean: "붙어요",       romanization: "bu-teo-yo" },
      past:    { korean: "붙었어요",     romanization: "bu-teo-sseo-yo" },
      future:  { korean: "붙을 거예요",  romanization: "bu-teul geo-ye-yo" },
      want:    { korean: "붙고 싶어요",  romanization: "but-go si-peo-yo" },
    },
  },
  {
    english: "to play, to hang out",
    korean: "놀다", romanization: "nol-da", category: "Everyday",
    conjugations: {
      present: { korean: "놀아요",       romanization: "no-ra-yo" },
      past:    { korean: "놀았어요",     romanization: "no-ra-sseo-yo" },
      future:  { korean: "놀 거예요",    romanization: "nol geo-ye-yo" },
      want:    { korean: "놀고 싶어요",  romanization: "nol-go si-peo-yo" },
    },
  },
  {
    english: "to live",
    korean: "살다", romanization: "sal-da", category: "Everyday",
    conjugations: {
      present: { korean: "살아요",       romanization: "sa-ra-yo" },
      past:    { korean: "살았어요",     romanization: "sa-ra-sseo-yo" },
      future:  { korean: "살 거예요",    romanization: "sal geo-ye-yo" },
      want:    { korean: "살고 싶어요",  romanization: "sal-go si-peo-yo" },
    },
  },
  {
    english: "to be far",
    korean: "멀다", romanization: "meol-da", category: "Descriptive",
    conjugations: {
      present: { korean: "멀어요",       romanization: "meo-reo-yo" },
      past:    { korean: "멀었어요",     romanization: "meo-reo-sseo-yo" },
      future:  { korean: "멀 거예요",    romanization: "meol geo-ye-yo" },
      want:    null,
    },
  },
];

// ===== State =====
let mode = "recall";               // "recall" | "conjugate" | "full"
let direction = "en-ko";           // "en-ko" prompts in English, "ko-en" in Korean
let activeCategory = "All";
let activeTense = "present";       // used only in conjugate mode
let deck = [];
let idx = 0;
let checked = false;               // conjugate: true after the answer was submitted

// Full drill: which CHAIN step is being asked, and the result of each one.
let step = 0;
let results = [];                  // [{ ok, input }] per completed step

const categories = [...new Set(allVerbs.map(v => v.category))];

// ===== Elements =====
const bodyEl      = document.body;
const filtersEl   = document.getElementById("filters");
const tenseFiltersEl = document.getElementById("tenseFilters");
const cardEl      = document.getElementById("card");
const cardScene   = document.getElementById("cardScene");
const frontCat    = document.getElementById("frontCat");
const frontTense  = document.getElementById("frontTense");
const frontMain   = document.getElementById("frontMain");
const frontSub    = document.getElementById("frontSub");
const frontHint   = document.getElementById("frontHint");
const stepList    = document.getElementById("stepList");
const backCat     = document.getElementById("backCat");
const backMain    = document.getElementById("backMain");
const backRoman   = document.getElementById("backRoman");
const backHint    = document.getElementById("backHint");
const conjList    = document.getElementById("conjList");
const progressEl  = document.getElementById("progress");
const answerInput = document.getElementById("answerInput");
const checkBtn    = document.getElementById("checkBtn");

// ===== Mode / direction toggles =====
document.querySelectorAll(".mode-btn[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
    bodyEl.classList.toggle("mode-recall",    mode === "recall");
    bodyEl.classList.toggle("mode-conjugate", mode === "conjugate");
    bodyEl.classList.toggle("mode-full",      mode === "full");
    rebuildDeck();
  });
});

document.querySelectorAll(".mode-btn[data-dir]").forEach(btn => {
  btn.addEventListener("click", () => {
    direction = btn.dataset.dir;
    document.querySelectorAll(".mode-btn[data-dir]").forEach(b => b.classList.toggle("active", b === btn));
    render();
  });
});

// ===== Filters =====
function buildFilters() {
  filtersEl.innerHTML = "";
  const label = document.createElement("span");
  label.className = "filters-label";
  label.textContent = "Verb type";
  filtersEl.appendChild(label);
  ["All", ...categories].forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      rebuildDeck();
    });
    filtersEl.appendChild(btn);
  });
}

function buildTenseFilters() {
  tenseFiltersEl.innerHTML = "";
  const label = document.createElement("span");
  label.className = "filters-label";
  label.textContent = "Drill tense";
  tenseFiltersEl.appendChild(label);
  TENSES.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (t.key === activeTense ? " active" : "");
    btn.textContent = t.label;
    btn.addEventListener("click", () => {
      activeTense = t.key;
      rebuildDeck();
    });
    tenseFiltersEl.appendChild(btn);
  });
}

function rebuildDeck() {
  let src = activeCategory === "All"
    ? allVerbs
    : allVerbs.filter(v => v.category === activeCategory);
  // In conjugate mode, skip verbs that don't have the active tense.
  if (mode === "conjugate") {
    src = src.filter(v => v.conjugations[activeTense]);
  }
  deck = [...src];
  idx = 0;
  buildFilters();
  buildTenseFilters();
  render();
}

// ===== Answer normalization =====
// Hangul: strip all whitespace. Romanization: lowercase, strip whitespace,
// hyphens, and common punctuation. Then either normalized target matches.
function normalize(s) {
  return (s || "")
    .toLowerCase()
    .replace(/[\s\-_.,!?'"]/g, "");
}

function isCorrect(input, target) {
  const n = normalize(input);
  return n === normalize(target.korean) || n === normalize(target.romanization);
}

// English answers (Korean → English direction) are matched leniently: any one
// of the comma-separated glosses counts, "to" and a leading "be" are optional,
// and bracketed notes like "(transport)" are ignored.
function canonEnglish(s) {
  const words = s.toLowerCase().replace(/\(.*?\)/g, " ").replace(/[^a-z\s]/g, " ")
    .trim().split(/\s+/).filter(Boolean);
  if (words[0] === "to") words.shift();
  if (words[0] === "be" && words.length > 1) words.shift();
  return words.join("");
}

function isCorrectEnglish(input, english) {
  const n = canonEnglish(input);
  if (!n) return false;
  return english.replace(/\(.*?\)/g, "").split(/[,;\/]/)
    .map(canonEnglish).filter(Boolean).some(a => a === n);
}

// ===== Full drill helpers =====
// What each CHAIN step asks for. The first step is the dictionary form when
// prompting in English, or the English meaning when prompting in Korean.
function stepInfo(v, key) {
  if (key === "base") {
    return direction === "en-ko"
      ? { label: "Dictionary form", answer: v.korean, check: s => isCorrect(s, v),
          placeholder: "Type the dictionary form (hangul or romanization)" }
      : { label: "Meaning", answer: v.english, check: s => isCorrectEnglish(s, v.english),
          placeholder: "Type the meaning in English" };
  }
  const t = TENSES.find(x => x.key === key);
  const c = v.conjugations[key];
  return { label: t.label, answer: c.korean, check: s => isCorrect(s, c),
           placeholder: `Type the ${t.label.toLowerCase()} form (${t.desc})` };
}

function renderSteps(v) {
  stepList.innerHTML = "";
  CHAIN.forEach((key, i) => {
    const info = stepInfo(v, key);
    const row = document.createElement("div");
    const r = results[i];
    row.className = "step-row " + (r ? (r.ok ? "ok" : "bad") : (i === step ? "current" : "pending"));
    const ans = document.createElement("span");
    ans.className = "step-ans";
    if (r) {
      if (!r.ok && r.input) {
        const you = document.createElement("span");
        you.className = "step-you";
        you.textContent = r.input;
        ans.appendChild(you);
      }
      ans.appendChild(document.createTextNode(info.answer));
    } else {
      ans.textContent = i === step ? "?" : "·";
    }
    row.innerHTML = `<span class="step-label">${info.label}</span>`;
    row.appendChild(ans);
    stepList.appendChild(row);
  });
}

// ===== Render =====
function render() {
  cardEl.classList.remove("flipped", "correct", "incorrect");
  checked = false;
  step = 0;
  results = [];
  answerInput.value = "";
  answerInput.disabled = false;
  checkBtn.textContent = "Check";
  stepList.innerHTML = "";

  if (deck.length === 0) {
    frontCat.textContent = "";
    frontTense.style.display = "none";
    frontMain.textContent = "No cards";
    frontMain.classList.remove("hangul");
    frontSub.textContent = "";
    backCat.textContent = "";
    backMain.textContent = "";
    backRoman.textContent = "";
    conjList.innerHTML = "";
    progressEl.textContent = "0 of 0";
    updateSpeakBtn();
    return;
  }

  const v = deck[idx];
  progressEl.textContent = `Card ${idx + 1} of ${deck.length}`;
  frontCat.textContent = v.category;
  backCat.textContent  = v.category;

  if (mode === "recall") {
    // Front: the prompt language. Back: the other language + conjugation table.
    frontTense.style.display = "none";
    frontSub.textContent  = "";
    frontHint.textContent = "tap to flip";
    backHint.textContent  = "tap to flip";

    if (direction === "en-ko") {
      frontMain.classList.remove("hangul");
      frontMain.textContent = v.english;
      backMain.textContent  = v.korean;
      backRoman.textContent = v.romanization;
    } else {
      frontMain.classList.add("hangul");
      frontMain.textContent = v.korean;
      backMain.textContent  = v.english;
      backRoman.textContent = `${v.korean} · ${v.romanization}`;
    }
    renderConjTable(v, null);
  } else if (mode === "conjugate") {
    // Conjugate mode. Front: base form + English + tense chip. Back: answer.
    const t = TENSES.find(x => x.key === activeTense);
    frontTense.style.display = "";
    frontTense.textContent = t.label;
    frontMain.classList.add("hangul");
    frontMain.textContent = v.korean;
    frontSub.textContent  = `${v.english}  →  ${t.desc}`;
    frontHint.textContent = "type answer below, Enter to check";
    answerInput.placeholder = "Type conjugation (hangul or romanization)";

    const target = v.conjugations[activeTense];
    backMain.textContent  = target.korean;
    backRoman.textContent = target.romanization;
    backHint.textContent  = "arrow key for next";
    conjList.innerHTML = "";

    setTimeout(() => answerInput.focus(), 50);
  } else {
    // Full drill. Front: prompt + the step list; back: summary table when done.
    if (direction === "en-ko") {
      frontMain.classList.remove("hangul");
      frontMain.textContent = v.english;
    } else {
      frontMain.classList.add("hangul");
      frontMain.textContent = v.korean;
    }
    frontSub.textContent = "";
    frontHint.textContent = "";
    backMain.textContent  = direction === "en-ko" ? v.korean : v.english;
    backRoman.textContent = direction === "en-ko" ? v.romanization : `${v.korean} · ${v.romanization}`;
    backHint.textContent  = "Enter or arrow key for next";
    conjList.innerHTML = "";
    renderStep(v);
  }

  updateSpeakBtn();
}

// Refreshes the chip, the step list, and the input prompt for the current step.
function renderStep(v) {
  const info = stepInfo(v, CHAIN[step]);
  frontTense.style.display = "";
  frontTense.textContent = `${step + 1}/${CHAIN.length} · ${info.label}`;
  answerInput.placeholder = info.placeholder;
  renderSteps(v);
  setTimeout(() => answerInput.focus(), 50);
}

// Back-face table. `marks` (full drill) is a map of tense key → ok/bad.
function renderConjTable(v, marks) {
  conjList.innerHTML = "";
  TENSES.forEach(t => {
    const c = v.conjugations[t.key];
    if (!c) return;
    const row = document.createElement("div");
    row.className = "conj-row" + (marks && t.key in marks ? (marks[t.key] ? " ok" : " bad") : "");
    row.innerHTML =
      `<span class="conj-label">${t.label}</span>` +
      `<span class="conj-form">${c.korean}</span>`;
    row.appendChild(speakerButton(c.korean, "small"));
    conjList.appendChild(row);
  });
}

// ===== Audio =====
// Recall speaks the base form (each conjugation row has its own button);
// Conjugate speaks the form being drilled; Full drill speaks the base form
// once it is on screen (Korean prompt, or after the first step is answered).
function currentSpeech() {
  if (deck.length === 0) return null;
  const v = deck[idx];
  if (mode === "recall") return speechTextOf(v);
  if (mode === "conjugate") {
    const target = v.conjugations[activeTense];
    return target ? target.korean : null;
  }
  return (direction === "ko-en" || results.length > 0) ? speechTextOf(v) : null;
}

const speakBtn = speakerButton(currentSpeech);
document.getElementById("backSpeak").appendChild(speakBtn);

function updateSpeakBtn() {
  speakBtn.style.display = currentSpeech() ? "" : "none";
}

// ===== Recall-mode flip on tap =====
cardScene.addEventListener("click", (e) => {
  // In the typing modes the user should type, not flip by tapping.
  if (mode !== "recall") return;
  cardEl.classList.toggle("flipped");
});

// ===== Check answer (Conjugate + Full drill) =====
function checkAnswer() {
  if (mode === "recall" || deck.length === 0) return;
  if (checked) { next(); return; }
  const v = deck[idx];

  if (mode === "conjugate") {
    const target = v.conjugations[activeTense];
    const correct = isCorrect(answerInput.value, target);
    cardEl.classList.add("flipped", correct ? "correct" : "incorrect");
    answerInput.disabled = true;
    checkBtn.textContent = "Next →";
    checked = true;
    return;
  }

  // Full drill: grade this step, then move on to the next one.
  const info = stepInfo(v, CHAIN[step]);
  results.push({ ok: info.check(answerInput.value), input: answerInput.value.trim() });
  answerInput.value = "";
  step++;
  updateSpeakBtn();

  if (step < CHAIN.length) { renderStep(v); return; }

  // All steps answered: flip to the summary, coloured by the overall result.
  renderSteps(v);
  const marks = {};
  CHAIN.forEach((key, i) => { if (key !== "base") marks[key] = results[i].ok; });
  renderConjTable(v, marks);
  const allOk = results.every(r => r.ok);
  cardEl.classList.add("flipped", allOk ? "correct" : "incorrect");
  answerInput.disabled = true;
  checkBtn.textContent = "Next →";
  checked = true;
}

checkBtn.addEventListener("click", checkAnswer);
answerInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); checkAnswer(); }
});

// ===== Navigation =====
function prev() {
  if (deck.length === 0) return;
  idx = (idx - 1 + deck.length) % deck.length;
  render();
}
function next() {
  if (deck.length === 0) return;
  idx = (idx + 1) % deck.length;
  render();
}

document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("nextBtn").addEventListener("click", next);

// ===== Shuffle =====
document.getElementById("shuffleBtn").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  render();
});

// ===== Keyboard =====
document.addEventListener("keydown", (e) => {
  // Don't hijack typing in the answer input (Enter is handled there directly).
  const typing = document.activeElement === answerInput;
  if (typing && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;

  if (e.key === "ArrowLeft")       { e.preventDefault(); prev(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === " " && mode === "recall") {
    e.preventDefault();
    cardEl.classList.toggle("flipped");
  }
  else if (e.key === "Enter" && checked) { e.preventDefault(); next(); }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); speak(currentSpeech()); }
});

// ===== Init =====
rebuildDeck();
</script>
</body>
</html>
