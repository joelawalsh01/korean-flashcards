<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Flashcards - Verbs & Conjugation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 16px;
  }

  /* --- Mode Toggle --- */
  .mode-toggle {
    display: inline-flex;
    background: #e6e9f2;
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 16px;
  }

  .mode-btn {
    padding: 6px 18px;
    border: none;
    background: transparent;
    color: #4361ee;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }

  .mode-btn.active {
    background: #4361ee;
    color: #fff;
  }

  /* --- Filters --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
    max-width: 600px;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 2px solid #4361ee;
    border-radius: 20px;
    background: #fff;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .filter-btn:hover { background: #eef1ff; }

  .filter-btn.active { background: #4361ee; color: #fff; }

  .tense-filters .filter-btn {
    border-color: #7048e8;
    color: #7048e8;
  }
  .tense-filters .filter-btn:hover { background: #f2ecff; }
  .tense-filters .filter-btn.active { background: #7048e8; color: #fff; }

  .tense-filters { display: none; }
  body.mode-conjugate .tense-filters { display: flex; }

  .filters-label {
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  /* --- Controls --- */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
    margin-bottom: 16px;
  }

  .ctrl-btn {
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    background: #4361ee;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .ctrl-btn:hover { background: #3a56d4; }

  .progress {
    font-size: 0.95rem;
    color: #555;
    font-weight: 500;
    min-width: 110px;
    text-align: center;
  }

  /* --- Card Scene --- */
  .card-scene {
    width: 360px;
    max-width: 92vw;
    height: 280px;
    perspective: 800px;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.5s ease;
    transform-style: preserve-3d;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }

  .card-front { background: #fff; }

  .card-back {
    background: #4361ee;
    color: #fff;
    transform: rotateY(180deg);
  }

  .card.correct .card-back { background: #2f9e44; }
  .card.incorrect .card-back { background: #c92a2a; }

  .card-category {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.55;
  }

  .tense-chip {
    position: absolute;
    top: 14px;
    right: 18px;
    padding: 3px 10px;
    background: #7048e8;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 10px;
  }

  .card-front .card-main {
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
  }

  .card-front .card-main.hangul {
    font-size: 2rem;
    font-weight: 700;
  }

  .card-front .card-sub {
    margin-top: 6px;
    font-size: 0.95rem;
    color: #666;
  }

  .card-back .card-main {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }

  .card-back .pronunciation {
    margin-top: 6px;
    font-size: 0.95rem;
    opacity: 0.85;
  }

  /* Conjugation list on back face (Recall mode) */
  .conj-list {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.95rem;
    opacity: 0.95;
    width: 100%;
    max-width: 260px;
  }

  .conj-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .conj-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.75;
    font-weight: 600;
  }

  .conj-form { font-weight: 600; }

  .card-hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.75rem;
    opacity: 0.4;
  }

  /* --- Conjugate input --- */
  .answer-row {
    display: none;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    width: 360px;
    max-width: 92vw;
  }
  body.mode-conjugate .answer-row { display: flex; }

  .answer-input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 1.1rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .answer-input:focus { border-color: #4361ee; }

  /* --- Nav --- */
  .nav {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .nav-btn {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #e0e0e0;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .nav-btn:hover { background: #ccc; }

  .keyboard-hint {
    margin-top: 20px;
    font-size: 0.78rem;
    color: #999;
    text-align: center;
    line-height: 1.6;
  }

  .keyboard-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f9f9f9;
    font-family: inherit;
    font-size: 0.78rem;
  }


  /* --- Audio button (playback lives in speak.js) --- */
  .speak-btn {
    border: none;
    background: rgba(255,255,255,0.2);
    color: inherit;
    font-size: 0.95rem;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .speak-btn:hover { background: rgba(255,255,255,0.36); }
  .speak-btn:active { transform: scale(0.9); }

  .speak-btn.small { font-size: 0.7rem; padding: 3px 5px; }

  /* Keeps the hangul and its speaker button on one line. */
  .main-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  /* --- Deck Switcher (shared across index/numbers/verbs/particles) --- */
  .deck-switch {
    display: inline-flex;
    background: #e6e9f2;
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 20px;
  }

  .deck-btn {
    padding: 6px 16px;
    color: #4361ee;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 20px;
    transition: background 0.2s, color 0.2s;
  }

  .deck-btn.active {
    background: #4361ee;
    color: #fff;
  }
</style>
</head>

<h1>Korean Verbs &amp; Conjugation</h1>
<p class="subtitle">TTMIK Lessons 17–18 — recall meanings and drill conjugations</p>

<div class="mode-toggle">
  <button class="mode-btn active" data-mode="recall">Recall</button>
  <button class="mode-btn" data-mode="conjugate">Conjugate</button>
</div>

<div class="filters" id="filters"></div>

<div class="controls">

</div>

<div class="nav">
  <button class="nav-btn" id="prevBtn">&#8592;</button>

</div>

</p>

  {

    },

  {
    // 르 irregular: 모르 + 아요 → 몰라요. "Want to not know" doesn't apply.
    english: "to not know",
    korean: "모르다", romanization: "mo-reu-da", category: "Everyday",
    conjugations: {
      present: { korean: "몰라요",   romanization: "mol-la-yo" },
      past:    { korean: "몰랐어요", romanization: "mol-la-sseo-yo" },
      want:    null,
    },
  },
];

// ===== State =====
let mode = "recall";               // "recall" | "conjugate"
let activeCategory = "All";
let activeTense = "present";       // used only in conjugate mode
let deck = [];
let idx = 0;
let checked = false;               // true after user has submitted an answer

const categories = [...new Set(allVerbs.map(v => v.category))];

// ===== Elements =====
const bodyEl      = document.body;
const filtersEl   = document.getElementById("filters");
const tenseFiltersEl = document.getElementById("tenseFilters");
const cardEl      = document.getElementById("card");
const cardScene   = document.getElementById("cardScene");
const frontCat    = document.getElementById("frontCat");
const frontTense  = document.getElementById("frontTense");
const frontMain   = document.getElementById("frontMain");
const frontSub    = document.getElementById("frontSub");
const frontHint   = document.getElementById("frontHint");
const backCat     = document.getElementById("backCat");
const backMain    = document.getElementById("backMain");
const backRoman   = document.getElementById("backRoman");
const backHint    = document.getElementById("backHint");
const conjList    = document.getElementById("conjList");
const progressEl  = document.getElementById("progress");
const answerInput = document.getElementById("answerInput");
const checkBtn    = document.getElementById("checkBtn");

// ===== Mode toggle =====
document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    bodyEl.classList.toggle("mode-recall",    mode === "recall");
    bodyEl.classList.toggle("mode-conjugate", mode === "conjugate");
    rebuildDeck();
  });
});

// ===== Filters =====
function buildFilters() {
  filtersEl.innerHTML = "";
  const label = document.createElement("span");
  label.className = "filters-label";
  label.textContent = "Verb type";
  filtersEl.appendChild(label);
  ["All", ...categories].forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === activeCategory ? " active" : "");
    btn.textContent = cat;
    btn.addEventListener("click", () => {
      activeCategory = cat;
      rebuildDeck();
    });
    filtersEl.appendChild(btn);
  });
}

function buildTenseFilters() {
  tenseFiltersEl.innerHTML = "";
  const label = document.createElement("span");
  label.className = "filters-label";
  label.textContent = "Drill tense";
  tenseFiltersEl.appendChild(label);
  TENSES.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (t.key === activeTense ? " active" : "");
    btn.textContent = t.label;
    btn.addEventListener("click", () => {
      activeTense = t.key;
      rebuildDeck();
    });
    tenseFiltersEl.appendChild(btn);
  });
}

function rebuildDeck() {
  let src = activeCategory === "All"
    ? allVerbs
    : allVerbs.filter(v => v.category === activeCategory);
  // In conjugate mode, skip verbs that don't have the active tense.
  if (mode === "conjugate") {
    src = src.filter(v => v.conjugations[activeTense]);
  }
  deck = [...src];
  idx = 0;
  buildFilters();
  buildTenseFilters();
  render();
}

// ===== Answer normalization =====
// Hangul: strip all whitespace. Romanization: lowercase, strip whitespace,
// hyphens, and common punctuation. Then either normalized target matches.
function normalize(s) {
  return (s || "")
    .toLowerCase()
    .replace(/[\s\-_.,!?'"]/g, "");
}

function isCorrect(input, target) {
  const n = normalize(input);
  return n === normalize(target.korean) || n === normalize(target.romanization);
}

// ===== Render =====
function render() {
  cardEl.classList.remove("flipped", "correct", "incorrect");
  checked = false;
  answerInput.value = "";
  answerInput.disabled = false;
  checkBtn.textContent = "Check";

  if (deck.length === 0) {
    frontCat.textContent = "";
    frontTense.style.display = "none";
    frontMain.textContent = "No cards";
    frontMain.classList.remove("hangul");
    frontSub.textContent = "";
    backCat.textContent = "";
    backMain.textContent = "";
    backRoman.textContent = "";
    conjList.innerHTML = "";
    progressEl.textContent = "0 of 0";
    updateSpeakBtn();
    return;
  }

  const v = deck[idx];
  progressEl.textContent = `Card ${idx + 1} of ${deck.length}`;
  frontCat.textContent = v.category;
  backCat.textContent  = v.category;

  if (mode === "recall") {
    // Front: English. Back: base form + full conjugation table.
    frontTense.style.display = "none";
    frontMain.classList.remove("hangul");
    frontMain.textContent = v.english;
    frontSub.textContent  = "";
    frontHint.textContent = "tap to flip";

    backMain.textContent  = v.korean;
    backRoman.textContent = v.romanization;
    backHint.textContent  = "tap to flip";

    conjList.innerHTML = "";
    TENSES.forEach(t => {
      const c = v.conjugations[t.key];
      if (!c) return;
      const row = document.createElement("div");
      row.className = "conj-row";
      row.innerHTML =
        `<span class="conj-label">${t.label}</span>` +
        `<span class="conj-form">${c.korean}</span>`;
      row.appendChild(speakerButton(c.korean, "small"));
      conjList.appendChild(row);
    });
  } else {
    // Conjugate mode. Front: base form + English + tense chip. Back: answer.
    const t = TENSES.find(x => x.key === activeTense);
    frontTense.style.display = "";
    frontTense.textContent = t.label;
    frontMain.classList.add("hangul");
    frontMain.textContent = v.korean;
    frontSub.textContent  = `${v.english}  →  ${t.desc}`;
    frontHint.textContent = "type answer below, Enter to check";

    const target = v.conjugations[activeTense];
    backMain.textContent  = target.korean;
    backRoman.textContent = target.romanization;
    backHint.textContent  = "arrow key for next";
    conjList.innerHTML = "";

    setTimeout(() => answerInput.focus(), 50);
  }

  updateSpeakBtn();
}

// ===== Audio =====
// Recall mode speaks the base form (each conjugation row has its own button);
// Conjugate mode speaks the form being drilled.
function currentSpeech() {
  if (deck.length === 0) return null;
  const v = deck[idx];
  if (mode === "recall") return speechTextOf(v);
  const target = v.conjugations[activeTense];
  return target ? target.korean : null;
}

const speakBtn = speakerButton(currentSpeech);
document.getElementById("backSpeak").appendChild(speakBtn);

function updateSpeakBtn() {
  speakBtn.style.display = currentSpeech() ? "" : "none";
}

// ===== Recall-mode flip on tap =====
cardScene.addEventListener("click", (e) => {
  // In conjugate mode the user should type, not flip by tapping.
  if (mode !== "recall") return;
  cardEl.classList.toggle("flipped");
});

// ===== Conjugate: check answer =====
function checkAnswer() {
  if (mode !== "conjugate" || deck.length === 0) return;
  if (checked) { next(); return; }
  const v = deck[idx];
  const target = v.conjugations[activeTense];
  const correct = isCorrect(answerInput.value, target);
  cardEl.classList.add("flipped", correct ? "correct" : "incorrect");
  answerInput.disabled = true;
  checkBtn.textContent = "Next →";
  checked = true;
}

checkBtn.addEventListener("click", checkAnswer);
answerInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); checkAnswer(); }
});

// ===== Navigation =====
function prev() {
  if (deck.length === 0) return;
  idx = (idx - 1 + deck.length) % deck.length;
  render();
}
function next() {
  if (deck.length === 0) return;
  idx = (idx + 1) % deck.length;
  render();
}

document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("nextBtn").addEventListener("click", next);

// ===== Shuffle =====
document.getElementById("shuffleBtn").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0;
  render();
});

// ===== Keyboard =====
document.addEventListener("keydown", (e) => {
  // Don't hijack typing in the answer input (Enter is handled there directly).
  const typing = document.activeElement === answerInput;
  if (typing && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;

  if (e.key === "ArrowLeft")       { e.preventDefault(); prev(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === " " && mode === "recall") {
    e.preventDefault();
    cardEl.classList.toggle("flipped");
  }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); speak(currentSpeech()); }
});

// ===== Init =====
rebuildDeck();
</script>
